name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -i ~/.ssh/deploy_key root@2.24.119.244 'set -e && git config --global --add safe.directory /var/www/personal-hub && cd /var/www/personal-hub && git pull origin main && composer install --no-dev --no-interaction --prefer-dist && npm ci --no-audit --no-fund && npm run build && php artisan migrate --force && php artisan config:clear && php artisan route:clear && php artisan view:clear && chown -R www-data:www-data storage bootstrap/cache public/build && echo DEPLOY_OK'